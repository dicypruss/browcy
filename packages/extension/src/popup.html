<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browcy</title>
  <style>
    body { width: 250px; font-family: -apple-system, sans-serif; padding: 16px; margin: 0; background: #1e1e1e; color: #fff; }
    h2 { margin: 0 0 12px 0; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .status { padding: 12px; border-radius: 8px; background: #2a2a2a; display: flex; align-items: center; justify-content: space-between; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot.connected { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
    .dot.disconnected { background: #f44336; box-shadow: 0 0 8px #f44336; }
    .dot.connecting { background: #ff9800; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    button { margin-top: 12px; width: 100%; padding: 8px; border: none; border-radius: 6px; background: #3b82f6; color: white; cursor: pointer; font-weight: 600; }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <h2>🌐 Browcy</h2>
  <div class="status" aria-live="polite">
    <span id="status-text">Checking...</span>
    <span id="status-dot" class="dot" aria-hidden="true"></span>
  </div>
  <button id="reconnect-btn" type="button">Reconnect</button>
  <script src="../dist/popup.js"></script>
</body>
</html>
